# Gitee Go 流水线（土豆每日自动签到）
# 新版 Gitee Go 结构：stages 元素直接用 - name:，没有 - stage: 包裹层。
# 执行器在国内(腾讯云)，可直连 api.td.tudouai.cn，无需中转。
# 凭据/通知变量请在 Gitee「流水线 → 通用变量/CI CD 变量」登记，脚本经 process.env 读取。
version: '1.0'
name: tudou-sign
displayName: 土豆签到

triggers:
  push:
    branches:
      precise:
        - master

stages:
  - name: sign-stage
    displayName: 执行签到
    steps:
      - step: build@nodejs
        name: run_sign
        displayName: 运行签到脚本
        nodeVersion: '20'
        commands:
          - node sign.js