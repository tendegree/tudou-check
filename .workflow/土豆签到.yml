# Gitee Go 流水线（土豆每日自动签到）
# 新版 Gitee Go 结构：stages 元素直接用 - name:，没有 - stage: 包裹层。
# 执行器在国内(腾讯云)，可直连 api.td.tudouai.cn，无需中转。
# 凭据/通知变量请在 Gitee「流水线 → 通用变量/CI CD 变量」登记，脚本经 process.env 读取。
version: '1.0'
name: tudou-sign
displayName: 土豆签到

triggers:
  schedule:
    #  = 08:00 北京时间 Gitee上是默认北京时间
    - cron: '0 8 0 * * ?'
      matchType: PRECISE
      branch: master
  push:
    branches:
      precise:
        - master

variables:
  global:
    - TUDOUAI_USER
    - TUDOUAI_TOKEN
    - WECOM_BOT_KEY

stages:
  - name: sign-stage
    displayName: 执行签到
    steps:
      - step: build@nodejs
        name: run_sign
        displayName: 运行签到脚本
        nodeVersion: '20'
        commands:
          # 该运行镜像未预装 node，这里从国内镜像下载 Node 二进制后再执行签到脚本
          - |
            set -e
            mkdir -p /tmp/node
            curl -fsSL --retry 3 https://npmmirror.com/mirrors/node/v20.9.0/node-v20.9.0-linux-x64.tar.gz | tar -xz -C /tmp/node --strip-components=1
            export PATH=/tmp/node/bin:$PATH
            node -v
            node sign.js