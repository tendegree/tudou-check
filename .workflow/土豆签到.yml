# Gitee Go 定时签到流水线（土豆每日自动签到）
# 路径：仓库根 /.workflow/ 下。Gitee Go 执行器在国内(腾讯云)，可直连 api.td.tudouai.cn，无需中转。
name: tudou-sign
displayName: 土豆签到

triggers:
  schedule:
    - matchType: PRECISE
      branch: master
      cron: '0 0 0 * * ?'   # 每天 00:00 UTC = 08:00 北京时间
  push:
    - matchType: BRANCH_OR_TAG
      branch: master

stages:
  - name: sign-stage
    displayName: 执行签到
    steps:
      - name: run-sign
        displayName: 安装依赖并签到
        step: bash@1
        inputs:
          script: |
            npm install && node sign.js